<!--
  Hero "Somos Nexia" — bloque HTML autónomo para el widget nativo HTML de Elementor.
  No depende del plugin nexia-elementor-widgets (aunque si está instalado, no pasa nada:
  las clases usan el prefijo nx-standalone- para no chocar con nada).

  CÓMO USARLO EN ELEMENTOR
  1. Añade una sección nueva, arriba del todo de la página.
     - Content Width: Full Width (no "Boxed")
     - Padding: 0 en los 4 lados (Advanced → Padding)
     - Margin: 0
  2. Dentro, un widget "HTML" (nativo de Elementor, búscalo por "HTML" en el panel).
  3. Pega TODO el contenido de este archivo dentro de ese widget.
  4. Guarda y revisa en vista previa — el hero trae su propia altura (100vh) y su
     propio fondo, así que la sección que lo contiene no necesita nada más.

  Sin logo ni menú de navegación: solo el fondo animado (radar, red de nodos,
  olas) y el wordmark "Somos Nexia" centrados.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  .nx-standalone-hero, .nx-standalone-hero *{box-sizing:border-box;}
  .nx-standalone-hero{
    position:relative; overflow:hidden; min-height:100vh; color:#fff;
    font-family:'Poppins', ui-sans-serif, system-ui, sans-serif;
    margin:0; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .nx-standalone-hero__bg{
    position:absolute; inset:0; z-index:0;
    background:radial-gradient(ellipse at 50% 30%, #1f45e0 0%, #0f2fae 45%, #071b6e 100%);
  }
  .nx-standalone-hero__nodes{position:absolute; inset:0; width:100%; height:100%; opacity:.18;}
  .nx-standalone-hero__pulses{position:absolute; inset:0; pointer-events:none;}
  .nx-standalone-hero__pulse{
    position:absolute; width:6px; height:6px; border-radius:50%; background:#fff;
    animation:nx-standalone-pulse 3.6s ease-in-out infinite;
  }
  @keyframes nx-standalone-pulse{0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.9; transform:scale(1.8);}}
  .nx-standalone-hero__radar{
    position:absolute; left:50%; top:54%; width:min(640px,92vw); aspect-ratio:1;
    transform:translate(-50%,-50%); pointer-events:none;
  }
  .nx-standalone-hero__ring{position:absolute; inset:0; border-radius:50%; border:1px solid rgba(255,255,255,.28);}
  .nx-standalone-hero__ring--outer{border-color:rgba(255,255,255,.55);}
  .nx-standalone-hero__axis{position:absolute; background:rgba(255,255,255,.25);}
  .nx-standalone-hero__axis--v{left:50%; top:0; bottom:0; width:1px;}
  .nx-standalone-hero__axis--h{top:50%; left:0; right:0; height:1px;}
  .nx-standalone-hero__sweep{
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 270deg, rgba(255,255,255,.4) 360deg);
    animation:nx-standalone-sweep 8s linear infinite;
  }
  @keyframes nx-standalone-sweep{to{transform:rotate(360deg);}}
  .nx-standalone-hero__blip{
    position:absolute; width:9px; height:9px; border-radius:50%; background:#fff;
    box-shadow:0 0 14px 3px rgba(255,255,255,.8); opacity:0; animation:nx-standalone-blip 8s linear infinite;
  }
  @keyframes nx-standalone-blip{0%{opacity:0;} 4%{opacity:1;} 30%,100%{opacity:0;}}
  .nx-standalone-hero__wave{position:absolute; left:0; bottom:-1px; width:200%; height:150px; display:block; animation:nx-standalone-wave 22s linear infinite;}
  .nx-standalone-hero__wave--2{height:115px; animation-duration:14s; animation-direction:reverse;}
  .nx-standalone-hero__wave--3{height:80px; animation-duration:9s;}
  @keyframes nx-standalone-wave{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  .nx-standalone-hero__wordmark-block{
    position:relative; z-index:1; text-align:center;
    padding:32px max(16px,4vw); display:flex; flex-direction:column;
    align-items:center; gap:24px;
  }
  .nx-standalone-hero__eyebrow{
    font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    opacity:0; animation:nx-standalone-fade 1s ease .6s both;
  }
  @keyframes nx-standalone-fade{from{opacity:0;} to{opacity:1;}}
  .nx-standalone-hero__wordmark{
    font-weight:800; font-size:clamp(56px,12vw,180px); line-height:.92;
    letter-spacing:-0.01em; text-transform:uppercase; margin:0;
  }
  .nx-standalone-hero__word-mask{display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em;}
  .nx-standalone-hero__word{display:inline-block; transform:translateY(105%); animation:nx-standalone-rise 1s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes nx-standalone-rise{from{transform:translateY(105%);} to{transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    .nx-standalone-hero__pulse, .nx-standalone-hero__sweep, .nx-standalone-hero__blip,
    .nx-standalone-hero__wave, .nx-standalone-hero__eyebrow, .nx-standalone-hero__word{
      animation:none!important; opacity:1!important; transform:none!important;
    }
  }
</style>

<div class="nx-standalone-hero">
  <div class="nx-standalone-hero__bg">
    <svg class="nx-standalone-hero__nodes" viewBox="0 0 1440 600" preserveAspectRatio="none">
      <polyline points="115.2,180 259.2,372 388.8,144 518.4,420 921.6,132 1051.2,384 1195.2,168 1324.8,348 748.8,84" fill="none" stroke="#fff" stroke-width="1"></polyline>
    </svg>
    <div class="nx-standalone-hero__pulses">
      <span class="nx-standalone-hero__pulse" style="left:8%;top:30%;animation-delay:0s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:18%;top:62%;animation-delay:.45s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:27%;top:24%;animation-delay:.9s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:36%;top:70%;animation-delay:1.35s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:64%;top:22%;animation-delay:1.8s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:73%;top:64%;animation-delay:2.25s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:83%;top:28%;animation-delay:2.7s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:92%;top:58%;animation-delay:3.15s;"></span>
      <span class="nx-standalone-hero__pulse" style="left:52%;top:14%;animation-delay:3.6s;"></span>
    </div>
    <div class="nx-standalone-hero__radar">
      <div class="nx-standalone-hero__ring nx-standalone-hero__ring--outer"></div>
      <div class="nx-standalone-hero__ring" style="inset:12.5%;"></div>
      <div class="nx-standalone-hero__ring" style="inset:25%;"></div>
      <div class="nx-standalone-hero__ring" style="inset:37.5%;"></div>
      <div class="nx-standalone-hero__axis nx-standalone-hero__axis--v"></div>
      <div class="nx-standalone-hero__axis nx-standalone-hero__axis--h"></div>
      <div class="nx-standalone-hero__sweep"></div>
      <span class="nx-standalone-hero__blip" style="left:62%;top:28%;animation-delay:0s;"></span>
      <span class="nx-standalone-hero__blip" style="left:35%;top:40%;animation-delay:1.7s;"></span>
      <span class="nx-standalone-hero__blip" style="left:70%;top:62%;animation-delay:3.4s;"></span>
      <span class="nx-standalone-hero__blip" style="left:44%;top:72%;animation-delay:5.2s;"></span>
    </div>
    <svg class="nx-standalone-hero__wave nx-standalone-hero__wave--1" viewBox="0 0 2880 120" preserveAspectRatio="none"><path d="M0 60 C240 10 480 10 720 60 C960 110 1200 110 1440 60 C1680 10 1920 10 2160 60 C2400 110 2640 110 2880 60 L2880 120 L0 120 Z" fill="rgba(255,255,255,.14)"></path></svg>
    <svg class="nx-standalone-hero__wave nx-standalone-hero__wave--2" viewBox="0 0 2880 120" preserveAspectRatio="none"><path d="M0 60 C240 10 480 10 720 60 C960 110 1200 110 1440 60 C1680 10 1920 10 2160 60 C2400 110 2640 110 2880 60 L2880 120 L0 120 Z" fill="rgba(255,255,255,.28)"></path></svg>
    <svg class="nx-standalone-hero__wave nx-standalone-hero__wave--3" viewBox="0 0 2880 120" preserveAspectRatio="none"><path d="M0 60 C240 10 480 10 720 60 C960 110 1200 110 1440 60 C1680 10 1920 10 2160 60 C2400 110 2640 110 2880 60 L2880 120 L0 120 Z" fill="#ffffff"></path></svg>
  </div>

  <div class="nx-standalone-hero__wordmark-block">
    <span class="nx-standalone-hero__eyebrow">Marketing sin humo, ejecución sin rodeos</span>
    <p class="nx-standalone-hero__wordmark">
      <span class="nx-standalone-hero__word-mask"><span class="nx-standalone-hero__word" style="animation-delay:.15s;">Somos</span></span>
      <span class="nx-standalone-hero__word-mask"><span class="nx-standalone-hero__word" style="animation-delay:.35s;">Nexia</span></span>
    </p>
  </div>
</div>
